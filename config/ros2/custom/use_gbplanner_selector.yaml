use_gbplanner_selector:
  ros__parameters:
    use_sim_time: true
    input_topic: /rmf/lidar/points_downsampled
    output_topic: /use_gbplanner
    # Hysteresis: enable GBPlanner only for close returns, but keep it enabled
    # until every return is farther than the larger threshold.
    distance_threshold_enable_gbplanner: 8.0
    distance_threshold_disable_gbplanner: 10.0
    duration_threshold: 1.0 # duration distance thrshold must be satisfied before switching use_gbplanner boolean
